[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "tap-spreadsheets-anywhere"
description = "Singer.io tap for extracting spreadsheet data from cloud storage"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "azure-storage-blob>=12.14",
  "boto3>=1.15.5",
  "google-cloud-storage>=2.7",
  "httpx2~=2.12",
  "imapfs @ git+https://github.com/Matatika/imapfs.git",
  "jsonpath-ng>=1.5.3",
  "msgraphfs>=0.4,<1",
  "openpyxl",
  "paramiko",
  "protobuf>=4.21.12",
  "pyarrow>=25",
  "singer-python>=5.0.12",
  "smart-open>=7.3",
  "voluptuous>=0.10.5",
  "xlrd",
]
[[project.maintainers]]
name = "Matatika"
email = "info@matatika.com"
[[project.authors]]
name = "Eric Simmerman"
[project.urls]
Homepage = "https://github.com/Matatika/tap-spreadsheets-anywhere"
Repository = "https://github.com/Matatika/tap-spreadsheets-anywhere"
[project.scripts]
tap-spreadsheets-anywhere = "tap_spreadsheets_anywhere:main"

[dependency-groups]
dev = [ "pytest" ]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0dev0"
[tool.hatch.metadata]
# Required because of the `imapfs @ git+...` direct URL dependency above.
allow-direct-references = true
[tool.hatch.build.targets.wheel]
packages = [ "tap_spreadsheets_anywhere" ]

[tool.ruff]
line-length = 120
[tool.ruff.format]
quote-style = "double"
[tool.ruff.lint]
extend-select = [
  "G",
  "LOG",
]

[tool.pytest]
testpaths = [ "tap_spreadsheets_anywhere/test" ]
